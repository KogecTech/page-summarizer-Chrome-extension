<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Summarizer AI</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- Main view -->
  <div id="view-main" class="view active">

    <header class="header">
      <div class="header-left">
        <div class="logo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
              stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="app-name">Page Summarizer AI</span>
      </div>
      <div class="header-right">
        <button id="btn-theme" class="icon-btn" aria-label="Toggle dark mode" title="Toggle theme">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="btn-settings" class="icon-btn" aria-label="Settings" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"
              stroke="currentColor" stroke-width="2"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="page-info">
      <p id="page-title" class="page-title">Loading page info…</p>
    </div>

    <div class="actions">
      <button id="btn-summarize" class="btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"
            stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <polyline points="13 2 13 9 20 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Summarize Page
      </button>
    </div>

    <!-- Loading state -->
    <div id="state-loading" class="state hidden">
      <div class="spinner"></div>
      <p class="state-text">Analyzing page content…</p>
    </div>

    <!-- Error state -->
    <div id="state-error" class="state hidden">
      <div class="error-icon">⚠️</div>
      <p id="error-message" class="error-text"></p>
      <button id="btn-retry" class="btn-secondary">Try again</button>
    </div>

    <!-- Summary output -->
    <div id="state-summary" class="summary-container hidden">

      <div class="summary-meta">
        <span id="meta-reading-time" class="meta-chip">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
            <polyline points="12 6 12 12 16 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span id="reading-time-text">—</span>
        </span>
        <span id="meta-word-count" class="meta-chip">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"
              stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span id="word-count-text">—</span>
        </span>
        <span id="cache-badge" class="meta-chip cache-badge hidden">cached</span>
      </div>

      <section class="summary-section">
        <h3 class="section-title">Summary</h3>
        <ul id="summary-list" class="bullet-list"></ul>
      </section>

      <section class="summary-section">
        <h3 class="section-title">Key Insights</h3>
        <ul id="insights-list" class="bullet-list insights"></ul>
      </section>

      <div class="summary-actions">
        <button id="btn-copy" class="btn-secondary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="2"/>
            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"
              stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Copy
        </button>
        <button id="btn-clear" class="btn-ghost">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <polyline points="3 6 5 6 21 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M19 6l-1 14H6L5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Clear
        </button>
      </div>
    </div>

  </div>

  <!-- Settings view -->
  <div id="view-settings" class="view hidden">
    <header class="header">
      <button id="btn-back" class="icon-btn" aria-label="Back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <polyline points="15 18 9 12 15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <span class="app-name">Settings</span>
      <div></div>
    </header>

    <div class="settings-body">
      <div class="setting-group">
        <label for="input-api-key" class="setting-label">
          Gemini API Key
          <a href="https://aistudio.google.com/app/apikey"
            target="_blank" rel="noopener noreferrer"
            class="setting-link">Get free key →</a>
        </label>
        <div class="api-key-row">
          <input
            type="password"
            id="input-api-key"
            class="setting-input"
            placeholder="AIza…"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="btn-toggle-key" class="icon-btn" aria-label="Show/hide key">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                stroke="currentColor" stroke-width="2"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
            </svg>
          </button>
        </div>
        <p class="setting-hint">
          A built-in API key is used by default. You can override it by entering your own key here. Stored locally in chrome.storage.
        </p>
      </div>

      <button id="btn-save-key" class="btn-primary">Save API Key</button>
      <p id="save-status" class="save-status hidden">✓ Saved successfully</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
